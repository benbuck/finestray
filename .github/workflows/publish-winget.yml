name: Publish winget package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5). Empty = latest vX.Y release."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

jobs:
  winget:
    name: Publish winget package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      WINGET_TOKEN: ${{ secrets.FINESTRAY_WINGET }}
    steps:
      - name: Resolve installer URL and version
        id: resolve
        run: |
          $wingetPackage = "Benbuck.Finestray"
          Write-Output "package=$wingetPackage" >> $env:GITHUB_OUTPUT

          $requestedTag = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($requestedTag)) {
            $requestedTag = "${{ github.event.release.tag_name }}"
          }
          if ([string]::IsNullOrEmpty($requestedTag)) {
             Write-Error "No tag given and no matching vX.Y release found."
             exit 1
          }

          $version = $requestedTag -replace '^v', ''
          $tagWithV = "v$version"
          $installerUrl = "https://github.com/benbuck/finestray/releases/download/$tagWithV/Finestray-$version-win64.exe"

          try {
            Invoke-WebRequest -Uri $installerUrl -Method Head | Out-Null
          } catch {
            Write-Error "Installer URL not reachable: $installerUrl"
            exit 1
          }

          Write-Output "Installer URL: $installerUrl"
          Write-Output "Version: $version"
          Write-Output "installer-url=$installerUrl" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Submit winget package
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            Write-Error "Missing FINESTRAY_WINGET secret. Create a classic PAT with 'repo' scope and add it as a repository secret named FINESTRAY_WINGET."
            exit 1
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          Write-Output ('.\wingetcreate.exe update {0} --submit --version {1} --urls "{2}" --token ***' -f '${{ steps.resolve.outputs.package }}', '${{ steps.resolve.outputs.version }}', '${{ steps.resolve.outputs.installer-url }}')
          .\wingetcreate.exe update "${{ steps.resolve.outputs.package }}" --submit --version "${{ steps.resolve.outputs.version }}" --urls "${{ steps.resolve.outputs.installer-url }}" --token $env:WINGET_TOKEN
